services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    image: opstrack-api:local
    build:
      context: .
      dockerfile: backend/OpsTrack.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: SqlServer
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=OpsTrack;User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: OpsTrack.Api
      Jwt__Audience: OpsTrack.Web
    depends_on:
      sqlserver:
        condition: service_healthy
  frontend:
    image: opstrack-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  sql-data:
