# Use with: docker compose -f docker-compose.yml -f docker-compose.demo.yml ...
services:
  sqlserver:
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.50
    environment:
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "1536"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.15
    ports: !override
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
